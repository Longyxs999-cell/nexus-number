<style>

.quick{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick .mini{padding:11px 7px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);text-align:center}.mini span{display:block;color:var(--muted);font-size:9px}.mini b{display:block;margin-top:4px;font-size:14px}

.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);z-index:60;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:rgba(31,32,37,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.nav-btn{padding:7px 2px 6px;border-radius:12px;background:transparent;color:#9296a2;font-size:9px;font-weight:950}.nav-btn .ico{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 3px;border-radius:9px;background:#373a43;font-size:12px}.nav-btn.active{color:#fff;background:rgba(255,255,255,.035)}.nav-btn.active .ico{background:#3383df;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(5,6,9,.65);backdrop-filter:blur(7px);display:flex;align-items:flex-end}.sheet{width:min(720px,100%);margin:0 auto;background:linear-gradient(180deg,#373a43,#25262d);border-radius:22px 22px 0 0;padding:15px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 45px rgba(0,0,0,.5)}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:5px 0 0;font-size:22px}.close{width:38px;height:38px;border-radius:12px;background:#2d3038;box-shadow:var(--shadow);font-size:24px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.menu-item{min-height:105px;text-align:left;padding:12px;border-radius:14px;background:linear-gradient(180deg,#444750,#30323a);border:1px solid var(--line);box-shadow:var(--shadow)}.menu-item b{display:block;font-size:11px;letter-spacing:.04em}.menu-item span{display:block;color:#a4a9b4;font-size:9px;margin-top:4px;line-height:1.3}.preview{display:block;margin-top:11px;color:#e8ebf0;font-size:13px;font-weight:1000}
.filters{display:grid;gap:8px}.field{width:100%;padding:11px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);outline:none;color:var(--text)}.field::placeholder{color:#707580}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{padding:9px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:#afb3bd;font-size:10px;font-weight:950}.chip.active{background:linear-gradient(180deg,#6eaffc,#397fce);color:#fff}.catalog-grid{display:grid;gap:8px;margin-top:10px}.catalog-card{display:grid;grid-template-columns:95px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:linear-gradient(180deg,#3d4048,#30323a);border:1px solid var(--line);box-shadow:var(--shadow)}.catalog-number{min-height:46px;border-radius:9px;background:linear-gradient(145deg,#eef1f5,#afb6c0,#e6e8ed);color:#181a1e;display:grid;place-items:center;font-size:10px;font-weight:1000;text-align:center;padding:4px}.catalog-card strong{font-size:11px}.catalog-card small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.catalog-card b{font-size:11px;white-space:nowrap}.open-item{margin-top:6px;padding:7px 9px;border-radius:8px;background:#3d8dde;color:#fff;font-size:9px;font-weight:950}
.lb{display:grid;gap:8px}.rank{display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center;padding:11px;border-radius:12px;background:linear-gradient(180deg,#3e4149,#2f3138);border:1px solid var(--line)}.rank .pos{font-size:13px;font-weight:1000;color:#bfc4cf}.rank strong{font-size:11px}.rank small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.rank .sum{font-size:12px;font-weight:1000}.rank.top{box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 7px 15px rgba(0,0,0,.23)}

.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.64);display:grid;place-items:center;padding:18px}.modal-card{width:min(560px,100%);padding:16px;border-radius:18px;background:linear-gradient(180deg,#3a3d46,#26272e);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.55)}.modal-head{display:flex;justify-content:space-between;align-items:start}.modal-head h2{margin:4px 0 0}.modal-body{display:grid;gap:9px;margin-top:13px}.modal-row{display:grid;gap:6px}.modal-row label{font-size:10px;color:var(--muted);font-weight:900}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.primary{background:linear-gradient(180deg,#5ba5ff,#2979df);color:#fff;border-radius:11px;padding:12px;font-weight:1000}.secondary{background:#343740;border:1px solid var(--line);border-radius:11px;padding:12px;font-weight:950}
.error{margin:25px auto;padding:15px;border-radius:14px;background:#43272b;border:1px solid #7f454f;color:#ffd7db;max-width:680px;font-size:13px;line-height:1.5}

<body>
<div class="app">
  <header class="topbar">
    <button id="menuBtn" class="round-btn" aria-label="Открыть меню"><span class="hamb"><i></i><i></i><i></i></span></button>
    <div class="title-wrap"><div class="mini-title">NEXUS NUMBER</div><div id="pageTitle" class="page-title">Генератор</div></div>
    <button id="themeBtn" class="round-btn" aria-label="Тема"><span class="theme-icon"></span></button>
  </header>
  <main id="appView" class="view"></main>
  <nav class="nav" aria-label="Основное меню">
    <button class="nav-btn active" data-page="generator"><span class="ico">N</span><span>Генератор</span></button>
    <button class="nav-btn" data-page="catalog"><span class="ico">▦</span><span>Каталог</span></button>
    <button class="nav-btn" data-page="collection"><span class="ico">◇</span><span>Коллекция</span></button>
    <button class="nav-btn" data-page="rating"><span class="ico">★</span><span>Рейтинг</span></button>
    <button class="nav-btn" data-page="stats"><span class="ico">◒</span><span>Стата</span></button>
  </nav>

      <div class="menu-grid">
        <button class="menu-item" data-page="generator"><b>ГЕНЕРАТОР</b><span>Общий пул всех типов</span><em class="preview">+7 999 777 77 77</em></button>
        <button class="menu-item" data-page="catalog"><b>КАТАЛОГ</b><span>Большая витрина и цены</span><em class="preview">МИФИЧЕСКИЕ → РЕДКИЕ</em></button>
        <button class="menu-item" data-page="collection"><b>КОЛЛЕКЦИЯ</b><span>Все твои уникальные номера</span><em class="preview">0 / ∞</em></button>
        <button class="menu-item" data-page="rating"><b>ЛИДЕРБОРД</b><span>Самые дорогие номера</span><em class="preview">#1 → #100</em></button>
        <button class="menu-item" data-page="stats"><b>СТАТИСТИКА</b><span>Шансы и редкость</span><em class="preview">100% DROP TABLE</em></button>
        <button class="menu-item" data-page="settings"><b>НАСТРОЙКИ</b><span>Звук, Worker и локальные данные</span><em class="preview">CONTROL</em></button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="bootError" class="error hidden"></div>
</div>
<script src="./game.js?v=5"></script>
<script>
setTimeout(function(){ if(!window.NEXUS_NUMBER_BOOTED){ var e=document.getElementById('bootError'); e.classList.remove('hidden'); e.innerHTML='<b>Не загрузился game.js</b><br>В GitHub Pages файл <b>game.js</b> должен лежать в той же папке, что и <b>index.html</b>.<br><br>Структура: <b>index.html</b> + <b>game.js</b> в корне репозитория.'; } }, 900);
