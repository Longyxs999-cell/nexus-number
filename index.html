  <style>

dal-head h2{margin:0;font-size:20px}.modal-grid{display:grid;gap:8px;margin-top:12px}.modal-row{padding:11px;border-radius:11px;background:#fff1;border:1px solid #fff1}.modal-row label{display:block;font-size:9px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.1em}.modal-row select{width:100%;padding:10px;border-radius:9px;background:#25272c;color:white;border:1px solid #fff2}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

<body>
  <div class="app">
    <header class="topbar">
      <button id="menuBtn" class="round-btn" aria-label="Меню"><span class="hamb"><i></i><i></i><i></i></span></button>
      <div class="title-wrap">
        <div class="mini-title">NEXUS NUMBER</div>
        <div class="page-title" id="pageTitle">Генератор</div>
      </div>
      <button id="themeBtn" class="round-btn" aria-label="Переключить тему">◐</button>
    </header>

    <main id="appView" class="view"></main>

    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-btn active" data-page="generator"><span class="nav-icon">N</span><span>Генератор</span></button>
      <button class="nav-btn" data-page="catalog"><span class="nav-icon">▦</span><span>Каталог</span></button>
      <button class="nav-btn" data-page="collection"><span class="nav-icon">◇</span><span>Коллекция</span></button>
      <button class="nav-btn" data-page="rating"><span class="nav-icon">★</span><span>Рейтинг</span></button>
      <button class="nav-btn" data-page="stats"><span class="nav-icon">◒</span><span>Стата</span></button>
    </nav>

    <div id="menuOverlay" class="overlay hidden" aria-hidden="true">
      <div class="menu-sheet">
        <div class="sheet-head"><div><span class="micro">NEXUS MENU</span><h2>Разделы</h2></div><button id="closeMenu" class="close-btn">×</button></div>
        <div class="menu-grid">
          <button class="menu-tile" data-page="generator"><b>ГЕНЕРАТОР</b><span>Выбить новый номер</span><em class="tile-preview">+7 999 777 77 77</em></button>
          <button class="menu-tile" data-page="catalog"><b>КАТАЛОГ</b><span>Редкие комбинации и цены</span><em class="tile-preview compact">777 · 001 · 123</em></button>
          <button class="menu-tile" data-page="collection"><b>КОЛЛЕКЦИЯ</b><span>Твои выбитые номера</span><em class="tile-preview">12 / 100</em></button>
          <button class="menu-tile" data-page="rating"><b>ЛИДЕРБОРД</b><span>Самые дорогие номера</span><em class="tile-preview">#1 48 700 000 ₽</em></button>
          <button class="menu-tile" data-page="stats"><b>СТАТИСТИКА</b><span>Твои результаты и редкость</span><em class="tile-preview">8 421 генераций</em></button>
          <button class="menu-tile" data-page="settings"><b>НАСТРОЙКИ</b><span>Страна, стиль, звук</span><em class="tile-preview">Россия · +7</em></button>
        </div>
        <div class="menu-note">Рекламного блока здесь нет. Все номера в игре — демонстрационные комбинации.</div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="./game.js"></script>
</body>
</html>
